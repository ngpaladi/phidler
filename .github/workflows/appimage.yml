name: Build Linux packages

# Builds a portable Linux AppImage, a Flatpak bundle, and .deb / .rpm packages of
# the app and uploads each as a workflow artifact. AppImage: python-appimage bundles a relocatable CPython, pip-installs phidler +
# the FDTD simulation stack (photonfdtd + JAX + matplotlib) into it, and
# repackages — no FUSE needed (it extracts rather than mounts), so it runs on the
# stock runner. Flatpak: flatpak-builder against the KDE runtime from Flathub (see
# packaging/flatpak/). deb / rpm: a relocatable CPython with the same stack under
# /opt/phidler, packed by nfpm (see packaging/linux/). On the nightly schedule
# (and manual runs) it also publishes a rolling `nightly` pre-release with all
# of them attached.
#
# Runners are pinned to ubuntu-24.04 rather than ubuntu-latest (which moves to
# Ubuntu 26 from Oct 2026): the Flatpak job's apt packages and its AppArmor
# user-namespace tweak are tested against 24.04. Re-test before bumping.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "packaging/appimage/**"
      - "packaging/flatpak/**"
      - "packaging/linux/**"
      - ".github/workflows/appimage.yml"
  schedule:
    # 08:00 UTC = 03:00 America/New_York during EST. GitHub Actions cron is
    # UTC-only (no DST), so in EDT (summer) this lands at 04:00 Eastern.
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install python-appimage
        run: pip install python-appimage

      - name: Build the AppImage
        # Downloads a manylinux CPython base, pip-installs the requirements
        # (photonfdtd from git, the FDTD extras, then this checkout) into it, and
        # repackages. Expect a few minutes and a large (~hundreds of MB) result.
        run: packaging/appimage/build.sh

      - name: Locate the AppImage
        id: find
        # Prefix ./ so it's runnable as a path, not looked up on PATH.
        run: echo "path=./$(ls Phidler-*.AppImage)" >> "$GITHUB_OUTPUT"

      - name: Low-level libraries the bundled Qt / gdsfactory may dlopen
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0

      - name: Smoke-test the AppImage (headless import)
        # Extract (no FUSE on runners) and drive the bundled Python directly:
        # importing the app + its heavy deps — including the FDTD simulation
        # stack (photonfdtd, jax, matplotlib) — proves the bundle is populated
        # and loadable, and guards that simulation stays bundled. A full GUI
        # launch can't be verified headlessly (it enters an event loop), so this
        # checks importability, not a running window.
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONNOUSERSITE: "1"
        run: |
          "${{ steps.find.outputs.path }}" --appimage-extract >/dev/null
          squashfs-root/usr/bin/python3.12 - <<'PY'
          import phidler, gdsfactory, PySide6.QtCore
          import photonfdtd, jax, matplotlib  # the bundled FDTD simulation stack
          print("AppImage import OK — phidler", phidler.__version__,
                "| photonfdtd", photonfdtd.__version__, "| jax", jax.__version__)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: Phidler-AppImage-x86_64
          path: Phidler-*.AppImage
          if-no-files-found: error

  flatpak:
    runs-on: ubuntu-24.04
    env:
      APP_ID: io.github.ngpaladi.Phidler
    steps:
      - uses: actions/checkout@v7

      - name: Install flatpak-builder
        # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor, which
        # bubblewrap (flatpak's sandbox) needs; lift it for this throwaway runner.
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder dbus
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build the Flatpak bundle
        # Pulls the KDE runtime + SDK from Flathub, pip-installs photonfdtd (git),
        # the FDTD extras and this checkout into /app, and exports a .flatpak.
        run: packaging/flatpak/build.sh

      - name: Smoke-test the Flatpak (headless import)
        # Install the actual bundle and import the app + its heavy deps (incl. the
        # FDTD stack) through the sandboxed Python — same check as the AppImage.
        run: |
          flatpak install --user -y --noninteractive --bundle Phidler-*.flatpak
          dbus-run-session -- flatpak run --env=QT_QPA_PLATFORM=offscreen \
            --env=PYTHONNOUSERSITE=1 --command=python3 "$APP_ID" - <<'PY'
          import phidler, gdsfactory, PySide6.QtCore
          import photonfdtd, jax, matplotlib  # the bundled FDTD simulation stack
          print("Flatpak import OK — phidler", phidler.__version__,
                "| photonfdtd", photonfdtd.__version__, "| jax", jax.__version__)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: Phidler-Flatpak-x86_64
          path: Phidler-*.flatpak
          if-no-files-found: error

  linux-packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10

      - name: Build the .deb and .rpm
        # Fetches a python-build-standalone CPython with uv, pip-installs the
        # stack into it, and packs it under /opt/phidler with nfpm.
        run: packaging/linux/build.sh

      - name: Smoke-test the .deb (install on Ubuntu, import, uninstall)
        # A real apt install proves the declared dependencies resolve; then the
        # same import check as the other packages, through the installed tree.
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y ./phidler_*_amd64.deb
          /opt/phidler/bin/python3 -s - <<'PY'
          import phidler, gdsfactory, PySide6.QtCore
          import photonfdtd, jax, matplotlib  # the bundled FDTD simulation stack
          from PySide6.QtWidgets import QApplication
          QApplication([])
          print(".deb import OK — phidler", phidler.__version__,
                "| photonfdtd", photonfdtd.__version__, "| jax", jax.__version__)
          PY
          test -x /usr/bin/phidler
          sudo apt-get remove -y phidler
          test ! -e /opt/phidler

      - name: Smoke-test the .rpm (install on Fedora, import)
        run: |
          cat > smoke_rpm.py <<'PY'
          import phidler, gdsfactory, photonfdtd, jax, matplotlib
          from PySide6.QtWidgets import QApplication
          QApplication([])
          print(".rpm import OK — phidler", phidler.__version__, "| photonfdtd", photonfdtd.__version__)
          PY
          docker run --rm -v "$PWD:/pkg" -e QT_QPA_PLATFORM=offscreen fedora:42 bash -ec '
            dnf install -y -q /pkg/phidler-*.x86_64.rpm
            /opt/phidler/bin/python3 -s /pkg/smoke_rpm.py
            test -x /usr/bin/phidler'

      - uses: actions/upload-artifact@v7
        with:
          name: Phidler-deb-rpm-x86_64
          path: |
            phidler_*.deb
            phidler-*.rpm
          if-no-files-found: error

  nightly-release:
    # Publish the built AppImage, Flatpak, .deb and .rpm as a rolling `nightly`
    # pre-release.
    # Only on the schedule or a manual run — ordinary pushes just produce the CI
    # artifacts above. Runs after (and only if) the build + smoke test passed, so a broken
    # build is never released. Scoped contents:write lives here, not on the builds.
    needs: [build, flatpak, linux-packages]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: Phidler-*x86_64
          merge-multiple: true

      - name: Publish / refresh the nightly pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Move the rolling `nightly` tag to this commit and re-publish the
        # release with the fresh packages. Delete-then-create keeps stable download
        # URLs for the AppImage and Flatpak (…/releases/download/nightly/Phidler-x86_64.AppImage
        # and …/Phidler-x86_64.flatpak); the .deb and .rpm names carry the version.
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly Phidler-*.AppImage Phidler-*.flatpak phidler_*.deb phidler-*.rpm \
            --title "Nightly build ($(date -u +%Y-%m-%d))" \
            --notes "Automated nightly build from \`${{ github.sha }}\`. All four packages bundle phidler and the FDTD simulation stack (photonfdtd + JAX + matplotlib). **AppImage:** self-contained, no install — \`chmod +x\` it and run. **Flatpak:** \`flatpak install --user Phidler-x86_64.flatpak\` (pulls the KDE runtime from Flathub), then \`flatpak run io.github.ngpaladi.Phidler\`. **.deb / .rpm:** \`sudo apt install ./phidler_*_amd64.deb\` or \`sudo dnf install ./phidler-*.x86_64.rpm\`, then run \`phidler\`." \
            --prerelease \
            --target "${{ github.sha }}"
