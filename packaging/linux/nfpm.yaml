# nfpm config for Phidler's .deb and .rpm. Build with packaging/linux/build.sh,
# which fills in the ${...} variables from its environment
# and stages the bundled Python under ${STAGE}.
#
# Both packages install the same self-contained tree: a relocatable CPython
# (python-build-standalone) under /opt/phidler with phidler and the FDTD stack
# (photonfdtd, JAX, matplotlib) pip-installed into it, so nothing touches the
# system Python. Only the system libraries PySide6's bundled Qt dlopens are
# declared as dependencies (for the modules phidler uses: QtCore, QtGui,
# QtWidgets and the xcb / Wayland platform plugins).
name: phidler
arch: ${NFPM_ARCH}
platform: linux
version: ${PHIDLER_VERSION}
release: 1
section: science
priority: optional
maintainer: ngpaladi <ngpaladi@gmail.com>
description: |
  Visual CAD for photonic integrated circuit layout, built on gdsfactory.
  Bundles its own Python with the photonfdtd FDTD solver (JAX) for
  simulation and chip training.
vendor: ngpaladi
homepage: https://github.com/ngpaladi/phidler

contents:
  - src: ${STAGE}/opt/phidler
    dst: /opt/phidler
    type: tree
  - src: ${LINUX_DIR}/phidler.sh
    dst: /usr/bin/phidler
    file_info:
      mode: 0755
  - src: ${STAGE}/io.github.ngpaladi.Phidler.desktop
    dst: /usr/share/applications/io.github.ngpaladi.Phidler.desktop
  - src: ${REPO_ROOT}/packaging/appimage/phidler/phidler.png
    dst: /usr/share/icons/hicolor/256x256/apps/io.github.ngpaladi.Phidler.png
  - src: ${REPO_ROOT}/packaging/flatpak/io.github.ngpaladi.Phidler.metainfo.xml
    dst: /usr/share/metainfo/io.github.ngpaladi.Phidler.metainfo.xml

scripts:
  # Byte-code caches the app writes at run time (e.g. a later
  # `pip install "jax[cuda12]"`) aren't in the package's file list; clear them so
  # removal leaves no /opt/phidler behind.
  postremove: ${LINUX_DIR}/postremove.sh

overrides:
  deb:
    depends:
      - libc6 (>= 2.28)
      # pygit2 (via gdsfactory) loads the system CA bundle at import.
      - ca-certificates
      - libegl1
      - libgl1
      - libfontconfig1
      - libdbus-1-3
      - libglib2.0-0t64 | libglib2.0-0
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libxcb-cursor0
      - libxcb-icccm4
      - libxcb-keysyms1
      - libxcb-shape0
    recommends:
      # Remote FDTD offload shells out to ssh/scp.
      - openssh-client
  rpm:
    # Library-based requirements, so the same rpm resolves on Fedora, RHEL and
    # openSUSE, whose package names differ.
    depends:
      - ca-certificates
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libdbus-1.so.3()(64bit)
      - libglib-2.0.so.0()(64bit)
      - libgthread-2.0.so.0()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libxcb-cursor.so.0()(64bit)
      - libxcb-icccm.so.4()(64bit)
      - libxcb-keysyms.so.1()(64bit)
      - libxcb-shape.so.0()(64bit)
    recommends:
      - openssh-clients

deb:
  compression: xz
rpm:
  compression: zstd
  group: Applications/Engineering
