# Flatpak manifest for Phidler. Build with packaging/flatpak/build.sh.
#
# Runtime: the KDE runtime, not plain freedesktop — it carries every system
# library the PySide6 wheel's bundled Qt dlopens (xcb-cursor, xkbcommon, EGL, …).
# Its own Qt is NOT used: PySide6 ships its own Qt build, so QT_PLUGIN_PATH is
# unset below to stop the runtime's (different-version) Qt plugins being loaded
# into PySide6's Qt. 6.11 sits on freedesktop 25.08 → Python 3.13, which is
# inside gdsfactory's supported 3.11–3.13 range; check that before bumping.
#
# Like the AppImage, the Python stack is pip-installed from the network at build
# time (photonfdtd from PyPI, which pulls in JAX, the FDTD extras, then this
# checkout) — hence `--share=network` in the build args. build.sh with GPU=1 adds
# JAX's CUDA 12 build to the same pip line (a ~2.3 GB bundle). That's fine for our own
# CI / local builds; a Flathub submission would instead need every wheel listed
# as a checksummed source (flatpak-pip-generator).
id: io.github.ngpaladi.Phidler
runtime: org.kde.Platform
runtime-version: "6.11"
sdk: org.kde.Sdk
command: phidler

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # all, not just dri: CUDA needs /dev/nvidia*. The NVIDIA driver's user-space
  # libraries (libcuda) come from the matching org.freedesktop.Platform.GL.nvidia-*
  # extension, which Flatpak installs to match the host driver.
  - --device=all
  # Remote FDTD offload shells out to ssh/scp (in the runtime) using the user's
  # ~/.ssh/config (visible via --filesystem=home); ssh-auth exposes their SSH
  # agent so passphrase-protected keys work. rsync isn't in the runtime, but
  # fdtd_remote falls back to tar over ssh.
  - --share=network
  - --socket=ssh-auth
  # A CAD tool: open/save GDS and .phidler files anywhere under $HOME.
  - --filesystem=home
  - --unset-env=QT_PLUGIN_PATH
  # Allocate GPU memory on demand rather than JAX's default 75% up front (the app
  # sets this too; kept here for the JAX GPU check's child process).
  - --env=XLA_PYTHON_CLIENT_PREALLOCATE=false

modules:
  - name: phidler
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
      env:
        # Never serve photonfdtd from a stale cached wheel (same as build.sh for
        # the AppImage).
        PIP_NO_CACHE_DIR: "1"
    build-commands:
      # photonfdtd first (it pulls in jax), plus the FDTD extras; keep in sync with
      # the [fdtd] group in pyproject.toml. build.sh GPU=1 appends "jax[cuda12]".
      - pip3 install --prefix=${FLATPAK_DEST} --no-warn-script-location
        "photonfdtd>=0.16.1" "matplotlib>=3.7"
      # Then this checkout. Its `phidler` console script gets a /usr/bin/python3
      # shebang, which is exactly the runtime's interpreter.
      - pip3 install --prefix=${FLATPAK_DEST} --no-warn-script-location .
      # Desktop integration: reuse the AppImage's .desktop + icon, renamed to the
      # app ID as Flatpak requires.
      - install -Dm644 packaging/appimage/phidler/phidler.desktop
        ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - sed -i "s/^Icon=.*/Icon=${FLATPAK_ID}/" ${FLATPAK_DEST}/share/applications/${FLATPAK_ID}.desktop
      - install -Dm644 packaging/appimage/phidler/phidler.png
        ${FLATPAK_DEST}/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml
        ${FLATPAK_DEST}/share/metainfo/${FLATPAK_ID}.metainfo.xml
    sources:
      - type: dir
        path: ../..
        # Keep local build state, venvs and previous bundles out of the copy
        # (build/ holds this very build's output — copying it would recurse).
        skip:
          - .git
          - .venv
          - .flatpak-builder
          - build
          - site
          - squashfs-root
          - Phidler-x86_64.AppImage
          - Phidler-x86_64.flatpak
